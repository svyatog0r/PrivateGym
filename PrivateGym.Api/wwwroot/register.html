<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Private Gym</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            border: 1px solid #e2e8f0;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

            .auth-header h1 {
                font-size: 1.75em;
                font-weight: 700;
                margin-bottom: 8px;
                color: #0f172a;
            }

            .auth-header p {
                color: #64748b;
                font-size: 0.95em;
            }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                font-size: 0.9em;
                font-weight: 600;
                color: #334155;
                margin-bottom: 8px;
            }

            .form-group input {
                width: 100%;
                padding: 12px 16px;
                border: 1px solid #cbd5e1;
                border-radius: 10px;
                font-size: 1em;
                transition: all 0.2s;
                background: #ffffff;
            }

                .form-group input:focus {
                    outline: none;
                    border-color: #667eea;
                    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
                }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            }

            .btn-primary:disabled {
                background: #cbd5e1;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9em;
            color: #64748b;
        }

            .auth-footer a {
                color: #667eea;
                text-decoration: none;
                font-weight: 600;
            }

                .auth-footer a:hover {
                    text-decoration: underline;
                }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9em;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Создать аккаунт</h1>
            <p>Присоединяйтесь к Private Gym</p>
        </div>

        <div id="error-box" class="error-message"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="fullName">ФИО</label>
                <input type="text" id="fullName" name="fullName" placeholder="Иванов Иван Иванович" required>
            </div>

            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Минимум 6 символов" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Подтвердите пароль</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" required>
            </div>

            <!-- при регистрации всегда назначается роль Клиента -->
            <input type="hidden" id="role" name="role" value="Client">

            <button type="submit" class="btn-primary" id="submit-btn">Зарегистрироваться</button>
        </form>

        <div class="auth-footer">
            Уже есть аккаунт? <a href="/login.html">Войти</a>
        </div>
    </div>

    <script src="/config.js"></script>
    <script>
                // Если пользователь уже авторизован, перенаправляем его
                if (window.Auth && window.Auth.isAuthenticated()) {
                    window.location.replace('/index.html');
                }

                document.getElementById('register-form').addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const fullName = document.getElementById('fullName').value.trim();
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    const role = document.getElementById('role').value; // Всегда "Client"

                    const errorBox = document.getElementById('error-box');
                    const submitBtn = document.getElementById('submit-btn');

                    // Сброс ошибок
                    errorBox.style.display = 'none';
                    errorBox.textContent = '';

                    // Валидация на стороне клиента
                    if (password !== confirmPassword) {
                        errorBox.textContent = 'Пароли не совпадают.';
                        errorBox.style.display = 'block';
                        return;
                    }

                    if (password.length < 6) {
                        errorBox.textContent = 'Пароль должен содержать минимум 6 символов.';
                        errorBox.style.display = 'block';
                        return;
                    }

                    // Блокируем кнопку на время запроса
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Регистрация...';

                    try {
                        const response = await window.apiRequest('/auth/register', {
                            method: 'POST',
                            body: { fullName, email, password, role }
                        });

                        if (response.ok) {
                            // Успешная регистрация
                            alert('✅ Регистрация прошла успешно! Теперь вы можете войти.');
                            window.location.replace('/login.html');
                        } else {
                            const errorData = await response.json();
                            throw new Error(errorData.message || 'Ошибка при регистрации. Проверьте данные.');
                        }
                    } catch (error) {
                        errorBox.textContent = error.message;
                        errorBox.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Зарегистрироваться';
                    }
                });
    </script>
</body>
</html>
